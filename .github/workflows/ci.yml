name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    name: Pest (PHP ${{ matrix.php-version }})

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd, exif, fileinfo
          coverage: pcov

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run Pest with coverage
        run: vendor/bin/pest --coverage --min=100

  pint:
    runs-on: ubuntu-latest
    name: Pint
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, exif, fileinfo

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - run: vendor/bin/pint --test

  phpstan:
    runs-on: ubuntu-latest
    name: PHPStan
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, exif, fileinfo

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - run: vendor/bin/phpstan analyse --no-progress

  rector:
    runs-on: ubuntu-latest
    name: Rector
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, exif, fileinfo

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - run: vendor/bin/rector --dry-run --no-progress-bar
